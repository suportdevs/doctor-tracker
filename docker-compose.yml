# Doctor Tracker — full stack in Docker.
#   docker compose up -d --build     → MongoDB + API (4000) + Next.js site & admin (3000)
#   docker compose up -d mongo       → only the database, for running server/client locally with npm
services:
  mongo:
    image: mongo:7.0
    container_name: doctor_tracker_mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: doctor_tracker_server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/doctor_tracker
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      SEED_ON_START: ${SEED_ON_START:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Doctor Tracker <no-reply@doctortracker.dev>}
      MAIL_PREVIEW: ${MAIL_PREVIEW:-true}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

  client:
    build:
      context: ./client
      args:
        # Browser → API (must be reachable from the user's machine)
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
        # Next.js server → API (inside the Docker network)
        API_URL: http://server:4000
    container_name: doctor_tracker_client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      API_URL: http://server:4000
    ports:
      - "3000:3000"

volumes:
  mongo_data:
  uploads:
